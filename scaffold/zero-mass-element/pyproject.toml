[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-mass-element"
version = "0.2.0"
description = "Validation-first nuclear prediction research platform"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "physics-evidence-core>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zme = "zero_mass_element.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
