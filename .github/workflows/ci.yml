name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check src tests

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit

  atlas-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_atlas_contract.py tests/unit/test_import_firewall.py tests/unit/test_pin.py

  leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/leakage

  synthetic-b001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/integration/test_synthetic_b001.py

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/integration/test_reproducibility.py

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/unit/test_schemas.py

  visual-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p .artifacts/tests
      - run: python -m pytest -q --junitxml=.artifacts/tests/junit.xml tests/unit/test_visual_metadata.py tests/unit/test_visual_layouts.py tests/unit/test_visual_event_ingest.py tests/unit/test_visual_aggregate.py tests/unit/test_visual_render_svg.py tests/unit/test_visual_readme.py tests/integration/test_visual_from_synthetic_b001.py tests/integration/test_visual_from_ci_artifacts.py
      - run: python -m elementzero visual build --input-root . --layout extended_200_project_v1 --output-root reports/visuals --no-update-readme
      - uses: actions/upload-artifact@v4
        with:
          name: elementzero-visual-table
          path: reports/visuals/

  model-table-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo12_tables.py

  federation-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo12_federation.py

  federation-leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo12_federation.py -k "leakage or disjoint or firewall or training_only or license_gate"

  federation-synthetic-b002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/integration/test_wo12_qualification.py::test_mini_federation_through_frozen_b002_mechanics

  federation-synthetic-b003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/integration/test_wo12_qualification.py::test_mini_federation_through_frozen_b003_mechanics

  federation-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      # Ordinary CI uses small golden fixtures; the raw public tables are
      # source-hashed and fetched by tools/fetch_model_tables.py for the
      # full qualification jobs.
      - run: python -m pytest -q tests/integration/test_wo12_qualification.py::test_mini_federation_deterministic

  eligibility-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo13_eligibility.py

  model-provenance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo13_eligibility.py -k "provenance or thresholds or protocol_hashes or inventory"

  historical-chronology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      # The committed chronology and AME1995 golden fixtures carry the
      # historical evidence; raw snapshots are only needed to re-derive it
      # (tools/fetch_ame_sources.py) and stay out of CI.
      - run: python -m pytest -q tests/unit/test_ame_parser.py tests/integration/test_wo13_reports.py::test_historical_source_chronology

  blind-subfederation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo13_eligibility.py -k "subfederation or combiner or residual or baseline or blind"

  claim-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/integration/test_wo13_reports.py -k "recon or claim or tracks or blind_validation"

  wo13-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      # Stage B rebuilds byte-for-byte from committed inputs; no raw table
      # or AME snapshot download is required.
      - run: python -m pytest -q tests/integration/test_wo13_reports.py::test_wo13_report_reproducible

  wo14-input-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo14_real_validation.py -k "input_hashes or protocol_and_registry"

  wo14-b002-blind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      # The committed sealed run is the evidence; CI verifies the seal, the
      # roster, and the claim boundary without any raw snapshot.
      - run: python -m pytest -q tests/unit/test_wo14_real_validation.py tests/integration/test_wo14_results.py -k "b002_blind or blind_workspaces"

  wo14-b002-recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/integration/test_wo14_results.py -k "b002_recon or improvement or recon_predictions"

  wo14-b003-blind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo14_real_validation.py tests/integration/test_wo14_results.py -k "derived_blindness or edge_not_equal or full_shell or b003_blind"

  wo14-b003-recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/integration/test_wo14_results.py -k "b003_recon"

  wo14-claim-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_wo14_real_validation.py tests/integration/test_wo14_results.py -k "claims or scope or visual or adjudicat or not_evaluable or events or atlas or status or truth"

  wo14-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install -e '.[dev]'
      # The report bundle rebuilds byte-for-byte from the committed result
      # trees; no raw snapshot download is required.
      - run: python -m pytest -q tests/integration/test_wo14_results.py::test_wo14_report_reproducible tests/integration/test_wo14_results.py::test_recon_predictions_still_sealed
