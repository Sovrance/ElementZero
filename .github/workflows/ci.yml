name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check src tests

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install numpy scipy scikit-learn pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q tests/unit

  atlas-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install numpy scipy scikit-learn pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q tests/unit/test_atlas_contract.py tests/unit/test_import_firewall.py tests/unit/test_pin.py

  leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install numpy scipy scikit-learn pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q tests/leakage

  synthetic-b001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install numpy scipy scikit-learn pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q tests/integration/test_synthetic_b001.py

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python tools/ensure_atlas_pir.py
      - run: python -m pip install numpy scipy scikit-learn pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q tests/integration/test_reproducibility.py

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/unit/test_schemas.py
