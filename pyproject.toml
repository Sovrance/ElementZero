[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elementzero"
version = "0.2.0"
description = "Nuclear mass prediction with Atlas PIR evidence, historical freezes, and blind validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sovrance AI" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
# Enable only after Atlas publishes installable packaging at the locked SHA.
# Until then: python tools/ensure_atlas_pir.py && pip install -e '.[dev]'
atlas = [
  "sovrance-atlas-pir @ git+https://github.com/Sovrance/Atlas.git@31d76d094f1206e64a6920da4775d0a684618357",
]

[project.scripts]
elementzero = "elementzero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["elementzero", "elementzero.*"]

[tool.setuptools.package-data]
elementzero = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.elementzero.atlas]
distribution = "sovrance-atlas-pir"
python_import = "pir"
repository = "https://github.com/Sovrance/Atlas.git"
ref = "31d76d094f1206e64a6920da4775d0a684618357"
supported_versions = ["0.1.0"]
reviewed_baseline = "31d76d094f1206e64a6920da4775d0a684618357"
